<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: preconnect + direct stylesheet link (avoids the render-blocking CSS @import chain) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link rel="preload" as="image" href="/profile.jpg" imagesrcset="/profile-420.jpg 420w, /profile.jpg 548w" imagesizes="(min-width: 1280px) 300px, (min-width: 1024px) 235px, 340px" fetchpriority="high" />
    <title>Sahin Mondal | Senior Software Engineer</title>
    <meta
      name="description"
      content="Senior Software Engineer and Full Stack Developer building production business applications, ERP, CRM, HRMS and dashboards using React.js, JavaScript, Node.js, Express.js and MongoDB."
    />
    <meta name="author" content="Sahin Mondal" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050816" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Open Graph / Social Sharing Metadata -->
    <meta property="og:title" content="Sahin Mondal | Senior Software Engineer" />
    <meta
      property="og:description"
      content="Senior Software Engineer and Full Stack Developer building ERP, CRM, HRMS and production business applications with React.js, Node.js and MongoDB."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:site_name" content="Sahin Mondal" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sahin Mondal — Senior Software Engineer and Full Stack Developer building business applications with React.js, Node.js and MongoDB"
    />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sahin Mondal | Senior Software Engineer" />
    <meta
      name="twitter:description"
      content="Senior Software Engineer and Full Stack Developer building ERP, CRM, HRMS and production business applications with React.js, Node.js and MongoDB."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Sahin Mondal — Senior Software Engineer and Full Stack Developer building business applications with React.js, Node.js and MongoDB"
    />

    <!-- Structured Data (JSON-LD Person Schema) -->
    <script id="portfolio-person-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sahin Mondal",
        "jobTitle": "Senior Software Engineer",
        "description": "Senior Software Engineer and Full Stack Developer building production business applications, ERP, CRM, HRMS and dashboards using React.js, JavaScript, Node.js, Express.js and MongoDB.",
        "url": "__SITE_URL__/",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kolkata",
          "addressCountry": "IN"
        },
        "knowsAbout": [
          "React.js",
          "JavaScript",
          "Node.js",
          "Express.js",
          "MongoDB"
        ],
        "sameAs": [
          "https://www.linkedin.com/in/sahinmondal7",
          "https://github.com/Sahin15"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/frontend.jsx"></script>
  </body>
</html>
