<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="50%" stop-color="#090e1f" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <radialGradient id="blueGlow" cx="20%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#blueGlow)" />
  <rect width="1200" height="630" fill="url(#purpleGlow)" />

  <!-- Outer Frame Border -->
  <rect x="32" y="32" width="1136" height="566" rx="28" fill="#0b1021" fill-opacity="0.65" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Top Accent Line -->
  <rect x="84" y="32" width="240" height="3" rx="1.5" fill="url(#accentGrad)" />

  <!-- Left Column: Identity & Core Value -->
  <!-- Monogram Badge -->
  <rect x="84" y="88" width="56" height="56" rx="14" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2" />
  <text x="112" y="124" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800">SM</text>

  <!-- Eyebrow Pill -->
  <rect x="156" y="98" width="276" height="36" rx="18" fill="#1e293b" fill-opacity="0.7" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.2" />
  <circle cx="178" cy="116" r="4.5" fill="#60a5fa" />
  <text x="194" y="121" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">PORTFOLIO &amp; CASE STUDIES</text>

  <!-- Name -->
  <text x="84" y="236" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">SAHIN MONDAL</text>

  <!-- Role Title -->
  <text x="84" y="294" fill="url(#accentGrad)" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">Senior Software Engineer</text>

  <!-- Summary Description -->
  <text x="84" y="356" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500">Full Stack Developer building production business software,</text>
  <text x="84" y="388" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500">ERP, CRM, HRMS and SaaS applications.</text>

  <!-- Stack Highlight Pill -->
  <rect x="84" y="446" width="380" height="54" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="112" y="480" fill="#f8fafc" font-family="JetBrains Mono, Consolas, monospace" font-size="22" font-weight="700">React · Node.js · MongoDB</text>

  <!-- Right Column: Subtle Architecture & Systems Preview -->
  <g transform="translate(760, 106)">
    <rect x="0" y="0" width="356" height="418" rx="22" fill="#080d1a" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="356" height="44" rx="22" fill="#0f172a" />
    <circle cx="24" cy="22" r="5" fill="#475569" />
    <circle cx="42" cy="22" r="5" fill="#475569" />
    <circle cx="60" cy="22" r="5" fill="#475569" />
    <text x="84" y="27" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="600">PRODUCTION SYSTEMS</text>

    <!-- System Node 1 -->
    <rect x="24" y="68" width="308" height="86" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.2" />
    <text x="44" y="98" fill="#60a5fa" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2">ENTERPRISE OPERATIONS</text>
    <text x="44" y="124" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">ERP · HRMS · CRM Systems</text>

    <!-- Connector 1 -->
    <line x1="178" y1="154" x2="178" y2="176" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4" />

    <!-- System Node 2 -->
    <rect x="24" y="176" width="308" height="86" rx="14" fill="#0f172a" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.2" />
    <text x="44" y="206" fill="#818cf8" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2">PRODUCT ARCHITECTURE</text>
    <text x="44" y="232" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Multi-Vertical SaaS Platforms</text>

    <!-- Connector 2 -->
    <line x1="178" y1="262" x2="178" y2="284" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" />

    <!-- System Node 3 -->
    <rect x="24" y="284" width="308" height="86" rx="14" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2" />
    <text x="44" y="314" fill="#c084fc" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2">FULL-STACK DEVELOPMENT</text>
    <text x="44" y="340" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">REST APIs · RBAC · Cloud VPS</text>
  </g>
</svg>

